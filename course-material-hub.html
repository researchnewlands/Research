<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Research Masterclass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { clinical: { 600: '#cc0a0a', 700: '#b00808' } } } }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
  <nav class="bg-white p-6 shadow-sm flex items-center justify-between">
    <a href="index.html" class="flex items-center space-x-3">
        <img src="nc-logo.png" alt="Newlands Clinic Logo" class="h-16 w-auto">
    </a>
    <div class="hidden lg:flex items-center space-x-8">
        <a href="index.html" class="text-sm uppercase tracking-wider font-semibold text-slate-600 hover:text-clinical-600 transition">Home</a>
        <a href="course-material-hub.html" class="text-sm uppercase tracking-wider font-semibold text-clinical-600 transition">Course Material</a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center py-12 px-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-[11px] font-extrabold uppercase text-clinical-600 tracking-wider">Research Masterclass</span>
            <h1 class="text-3xl font-bold text-slate-900 mt-2">Student Portal</h1>
            <p class="text-slate-500 mt-2 text-sm">Sign in with the username and password sent to you by the Research team.</p>
        </div>

        <form id="login-form" class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input id="username" type="text" autocomplete="username" required
                       class="w-full px-4 py-3 border border-slate-300 rounded focus:outline-none focus:border-clinical-600 focus:ring-1 focus:ring-clinical-600"
                       placeholder="e.g. tmoyo">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input id="password" type="password" autocomplete="current-password" required
                       class="w-full px-4 py-3 border border-slate-300 rounded focus:outline-none focus:border-clinical-600 focus:ring-1 focus:ring-clinical-600">
            </div>
            <p id="login-error" class="hidden text-sm font-semibold text-clinical-600">Incorrect username or password.</p>
            <button type="submit"
                    class="w-full px-6 py-3 bg-clinical-600 hover:bg-clinical-700 text-white font-bold rounded shadow-sm transition">
                Sign in
            </button>
            <p class="text-xs text-slate-500 text-center">
                Forgotten your details? Email
                <a href="mailto:research@newlandsclinic.org.zw" class="text-clinical-600 font-semibold">research@newlandsclinic.org.zw</a>
            </p>
        </form>
    </div>
  </main>

  <script>
    /* =================================================================
       STUDENT ACCOUNTS
       -----------------------------------------------------------------
       One line per student. Passwords are never written here in plain
       text — only a fingerprint (hash) of "username:password".
       To add a student, open make-password.html, type their username
       and password, and paste the line it gives you into this list.

       cohort: 1 → First cohort (July–October 2026)
               2 → Second cohort (October–December 2026)
       ================================================================= */
    const ACCOUNTS = [
        // Shared login for Cohort 1 (username: cohort1 / password: Research2026)
        { user: "cohort1",      cohort: 1, hash: "28e33a1928a60133a5141566a182bd0ee570389b843b346636eec408d275fd2a" },

        // Shared login for Cohort 2 (username: cohort2 / password: Masterclass2026)
        { user: "cohort2",      cohort: 2, hash: "a6b3ef29645cfe264cdd6501304a0f3c8fe86661d290cd8c70c73be1ece163f8" },

        // Optional: individual student logins can be added below this line (use make-password.html):
    ];

    const COHORT_PAGES = {
        1: "cohort-1-materials.html",
        2: "cohort-2-materials.html"
    };

    async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const buf = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // Already signed in? Go straight to the right cohort page.
    try {
        const saved = JSON.parse(sessionStorage.getItem("rmc_session") || "null");
        if (saved && COHORT_PAGES[saved.cohort]) window.location.replace(COHORT_PAGES[saved.cohort]);
    } catch (e) {}

    document.getElementById("login-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const user = document.getElementById("username").value.trim().toLowerCase();
        const pass = document.getElementById("password").value;
        const hash = await sha256(user + ":" + pass);
        const account = ACCOUNTS.find(a => a.user === user && a.hash === hash);

        if (!account) {
            document.getElementById("login-error").classList.remove("hidden");
            return;
        }
        try {
            sessionStorage.setItem("rmc_session", JSON.stringify({ user: account.user, cohort: account.cohort }));
        } catch (e) {}
        window.location.href = COHORT_PAGES[account.cohort];
    });
  </script>
</body>
</html>
