<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Line Maker | Research Masterclass</title>
    <meta name="robots" content="noindex">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6">
  <div class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-xl shadow-sm p-8 space-y-4">
    <h1 class="text-2xl font-bold">Make a student account line</h1>
    <p class="text-sm text-slate-500">For the Research team. Nothing typed here is saved or sent anywhere. Copy the line into the ACCOUNTS list in course-material-hub.html.</p>

    <div class="grid md:grid-cols-3 gap-3">
        <input id="u" placeholder="Username (e.g. tmoyo)" class="px-3 py-2 border border-slate-300 rounded">
        <input id="p" placeholder="Password" class="px-3 py-2 border border-slate-300 rounded">
        <select id="c" class="px-3 py-2 border border-slate-300 rounded">
            <option value="2">Cohort 2</option>
            <option value="1">Cohort 1</option>
        </select>
    </div>
    <div class="flex gap-3">
        <button onclick="make()" class="px-5 py-2 bg-red-700 text-white font-bold rounded">Make line</button>
        <button onclick="randomPass()" class="px-5 py-2 border border-slate-300 rounded font-semibold">Suggest a password</button>
    </div>
    <textarea id="out" rows="3" readonly class="w-full font-mono text-xs p-3 border border-slate-300 rounded bg-slate-50"></textarea>
  </div>
  <script>
    async function sha256(t) {
        const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
        return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
    }
    async function make() {
        const u = document.getElementById("u").value.trim().toLowerCase();
        const p = document.getElementById("p").value;
        const c = document.getElementById("c").value;
        if (!u || !p) { alert("Enter a username and a password."); return; }
        const h = await sha256(u + ":" + p);
        document.getElementById("out").value =
            `{ user: "${u}", cohort: ${c}, hash: "${h}" },   // password given to student: ${p.replace(/./g, "•")}`;
    }
    function randomPass() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
        const a = crypto.getRandomValues(new Uint32Array(10));
        document.getElementById("p").value = Array.from(a, n => chars[n % chars.length]).join("");
    }
  </script>
</body>
</html>
