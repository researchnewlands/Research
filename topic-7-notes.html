
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Introduction to Statistics for Epidemiology — Slide Deck — Research Masterclass for Clinicians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#25374F;
    --navy-deep:#1B2A3D;
    --red:#E63425;
    --red-deep:#C32A1D;
    --paper:#FFFFFF;
    --light:#F4F5F7;
    --line:#E3E7EB;
    --ink:#27313B;
    --slate:#5B6B7C;
    --gold:#F2A93B;
    --green:#5B9A56;
    --teal:#2E8B9B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--navy-deep);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Poppins',Segoe UI,Helvetica,Arial,sans-serif; margin:0; color:var(--navy);}
  .mono{font-family:'IBM Plex Mono',Consolas,monospace;}

  /* ---------- chrome: top bar ---------- */
  #chrome{position:fixed; top:0; left:0; right:0; height:56px; z-index:80; display:flex; align-items:center; justify-content:space-between; padding:0 22px; background:rgba(27,42,61,0.92); backdrop-filter:blur(6px);}
  #chrome .brand{display:flex; align-items:center; gap:10px;}
  #chrome .brand img{height:26px;}
  #chrome .brand .name{font-family:'Poppins'; font-weight:700; font-size:13px; color:#fff; line-height:1.15;}
  #chrome .brand .tag{font-size:10px; color:#9FB0C2; letter-spacing:.05em;}
  #chrome .center{font-family:'IBM Plex Mono'; font-size:12px; color:#9FB0C2; letter-spacing:.04em;}
  #chrome .right{display:flex; align-items:center; gap:14px;}
  #counter{font-family:'IBM Plex Mono'; font-size:13px; color:#fff; min-width:56px; text-align:right;}
  #menuBtn{appearance:none; border:1.5px solid rgba(255,255,255,0.35); background:transparent; color:#fff; font-family:'Inter'; font-weight:600; font-size:12.5px; padding:7px 13px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  #menuBtn:hover{background:rgba(255,255,255,0.12);}

  #progressTrack{position:fixed; top:56px; left:0; right:0; height:3px; background:rgba(255,255,255,0.08); z-index:80;}
  #progressBar{height:100%; background:var(--red); width:0%; transition:width .3s ease;}

  /* ---------- slide menu drawer ---------- */
  #menuPanel{position:fixed; top:0; right:0; height:100%; width:min(360px,88vw); background:var(--navy); color:#fff; z-index:95; padding:26px 22px; transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); overflow-y:auto; box-shadow:-12px 0 40px rgba(0,0,0,.35);}
  #menuPanel.open{transform:translateX(0);}
  #menuPanel h4{color:var(--red); font-size:11px; letter-spacing:.08em; margin-bottom:16px; text-transform:uppercase;}
  #menuClose{position:absolute; top:20px; right:20px; background:none; border:none; color:#fff; cursor:pointer; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  #menuClose:hover{background:rgba(255,255,255,0.12);}
  .menu-item{display:flex; gap:10px; align-items:baseline; padding:10px 6px; border-radius:8px; cursor:pointer; font-size:13.5px; color:#DCE3EA; border-bottom:1px solid rgba(255,255,255,0.07);}
  .menu-item:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .menu-item .n{font-family:'IBM Plex Mono'; font-size:11px; color:var(--red); min-width:22px; flex-shrink:0;}
  #menuOverlay{position:fixed; inset:0; background:rgba(10,16,24,.5); z-index:90; opacity:0; pointer-events:none; transition:opacity .25s;}
  #menuOverlay.open{opacity:1; pointer-events:auto;}

  /* ---------- deck ---------- */
  #deck{position:fixed; top:0; left:0; right:0; bottom:0; overflow:hidden;}
  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding:110px 100px 90px; opacity:0; pointer-events:none; transform:translateX(24px);
    transition:opacity .35s ease, transform .35s ease; background:var(--paper); overflow:hidden;
  }
  .slide.active{opacity:1; pointer-events:auto; transform:translateX(0); z-index:2;}
  .slide.title-slide{background:var(--navy); color:#fff;}
  .slide.title-slide h1,.slide.title-slide h2,.slide.title-slide h3{color:#fff;}
  .slide-eyebrow{font-family:'IBM Plex Mono'; font-size:14px; font-weight:600; letter-spacing:.09em; color:var(--red); margin-bottom:16px; text-transform:uppercase;}
  .title-slide .slide-eyebrow{color:#FF8A7A;}
  .slide h1{font-size:clamp(34px,4.4vw,54px); font-weight:800; line-height:1.08; margin-bottom:14px;}
  .slide h2{font-size:clamp(28px,3.4vw,42px); font-weight:800; line-height:1.12; margin-bottom:22px;}
  .slide .sub{font-size:clamp(18px,1.7vw,23px); color:var(--red); font-weight:600; margin-bottom:8px;}
  .title-slide .sub{color:#FF8A7A;}
  .slide p.lead{font-size:clamp(18px,1.6vw,22px); color:var(--slate); max-width:900px; line-height:1.5;}
  .title-slide p.lead{color:#C9D3DD;}
  .slide-body{font-size:22px; line-height:1.5;}

  /* generic building blocks, scaled up for projection */
  .big-cols{display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:8px;}
  .big-cols.cols-3{grid-template-columns:repeat(3,1fr);}
  .big-cols.cols-4{grid-template-columns:repeat(4,1fr);}
  .bcard{border-radius:18px; padding:28px 30px;}
  .bcard.light{background:var(--light);}
  .bcard.dark{background:var(--navy); color:#fff;}
  .bcard .btitle{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .bcard .badge{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:11px; font-weight:700; color:#fff; flex-shrink:0;}
  .bcard h3{font-size:22px;}
  .bcard.dark h3{color:#fff;}
  .bcard p{font-size:18px; line-height:1.45; margin:0;}
  .bcard.dark p{color:#DCE3EA;}
  .bcard b{color:var(--red);}
  .bcard.dark b{color:#FF8A7A;}

  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:10px;}
  .stat-card{background:var(--light); border-radius:18px; padding:30px 32px;}
  .stat-card .big{font-family:'Poppins'; font-weight:800; font-size:52px; color:var(--red); line-height:1;}
  .stat-card p{font-size:17px; margin-top:12px; line-height:1.4;}

  ul.big-list{margin:6px 0 0; padding-left:30px; font-size:22px; line-height:1.7;}
  ul.big-list li{margin-bottom:6px;}
  ol.big-list{margin:6px 0 0; padding-left:30px; font-size:22px; line-height:1.7;}
  ol.big-list li{margin-bottom:10px;}

  table.slide-table{width:100%; border-collapse:collapse; margin-top:14px; font-size:19px;}
  table.slide-table th{background:var(--navy-deep); color:#fff; text-align:left; font-weight:600; padding:14px 16px; font-size:16px;}
  table.slide-table th:not(:first-child), table.slide-table td:not(:first-child){text-align:center;}
  table.slide-table td{padding:13px 16px; border-bottom:1px solid var(--line);}
  table.slide-table tr:nth-child(even) td{background:var(--light);}
  table.slide-table td:first-child{font-weight:600; color:var(--navy);}

  .pill-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:14px;}
  .pill{background:var(--light); border-radius:999px; padding:12px 22px; font-size:17px; font-weight:600; color:var(--navy);}

  .swatch-line{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .swatch-line .dot{width:16px; height:16px; border-radius:50%; flex-shrink:0;}
  .swatch-line h3{font-size:22px;}
  .swatch-line + p{font-size:18px; color:var(--ink); margin:0 0 20px 30px; line-height:1.45;}

  .timeline-row{display:flex; align-items:flex-start; justify-content:space-between; margin:20px 0; position:relative;}
  .timeline-row::before{content:""; position:absolute; top:28px; left:6%; right:6%; height:2px; background:repeating-linear-gradient(90deg,var(--line) 0 8px, transparent 8px 14px);}
  .timeline-row .step{display:flex; flex-direction:column; align-items:center; gap:10px; flex:1; position:relative; z-index:1;}
  .timeline-row .circ{width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'IBM Plex Mono'; font-size:12px; font-weight:700; border:3px solid #fff; box-shadow:0 0 0 1px var(--line);}
  .timeline-row .lab{font-size:15px; font-weight:600; color:var(--navy); text-align:center; max-width:150px;}

  .quote-block{background:var(--light); border-radius:18px; padding:34px 38px; margin-top:10px;}
  .quote-block p{font-size:22px; font-style:italic; color:var(--ink); line-height:1.5; margin:0;}
  .quote-block .cite{margin-top:14px; font-size:15px; color:var(--slate); font-style:normal;}

  .finding-strip{margin-top:18px; padding:16px 22px; background:#FCEAE8; border-left:4px solid var(--red); border-radius:0 10px 10px 0; font-size:18px; color:var(--red-deep); font-weight:600;}

  .foot-note{position:absolute; bottom:34px; left:100px; right:100px; font-size:13.5px; color:var(--slate); border-top:1px solid var(--line); padding-top:12px;}
  .title-slide .foot-note{color:#9FB0C2; border-top-color:rgba(255,255,255,0.15);}

  /* nav arrows */
  .nav-btn{position:fixed; top:50%; transform:translateY(-50%); z-index:70; width:52px; height:52px; border-radius:50%; background:rgba(27,42,61,0.65); border:1.5px solid rgba(255,255,255,0.25); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s;}
  .nav-btn:hover{background:var(--red); border-color:var(--red);}
  .nav-btn.prev{left:20px;}
  .nav-btn.next{right:20px;}
  .nav-btn:disabled{opacity:.25; pointer-events:none;}

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  @media (max-width:900px){
    .slide{padding:96px 34px 70px;}
    .big-cols, .big-cols.cols-3, .big-cols.cols-4{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:1fr;}
    .foot-note{left:34px; right:34px;}
  }
</style>
</head>

  `<div class="slide">

    <h2>Why Statistics Matters to a Clinician</h2>
    <p class="lead" style="margin-bottom:10px;">Statistics underlies almost every published sentence with a number in it.</p>
    <div class="stat-row">
      <div class="stat-card">
        <div class="big">158<span style="font-size:24px; color:var(--ink);">&nbsp;(86&ndash;274)</span></div>

      </div>
      <div class="stat-card">
        <div class="big">15.5%</div>
        <p>Proportion of 4,110 patients with hypertension at baseline, same cohort (Chimbetete et al. 2017, <i>Trop Med Int Health</i>).</p>
      </div>
    </div>
    <div class="finding-strip">One figure needed a median and a range. The other needed only a percentage &mdash; matching the summary to the data is the core skill of this session.</div>
  </div>`,

  // 4. WHAT IS STATISTICS
  `<div class="slide">
    <div class="slide-eyebrow">Section 01 &middot; Foundations</div>
    <h2>What Is Statistics?</h2>
    <div class="big-cols">
      <div class="bcard light">
        <div class="btitle"><div class="badge" style="background:#25374F;">DATA</div><h3>Statistics as data</h3></div>
        <p>The numbers we get when we measure or count things &mdash; a birthweight, a CD4 count, the number of typhoid notifications in a district.</p>
      </div>
      <div class="bcard dark">
        <div class="btitle"><div class="badge" style="background:#E63425;">METHODS</div><h3>Statistics as methods</h3></div>
        <p>A collection of procedures that let us organise, summarise, present and draw conclusions from data.</p>
      </div>
    </div>
    <p style="font-size:19px; color:var(--slate); margin-top:26px;">Most epidemiological work needs both: collect the data, then apply the methods.</p>
  </div>`,

  // 5. STATISTICS AS DATA
  `<div class="slide">
    <div class="slide-eyebrow">Section 01 &middot; Foundations</div>
    <h2>Two Kinds of "Data"</h2>
    <div class="big-cols">
      <div class="bcard light">
        <h3 style="margin-bottom:10px;">Measurements</h3>
        <p style="font-size:16px; color:var(--slate); margin-bottom:10px;">Birthweight (kg), first 20 babies, a Harare maternity unit</p>
        <p style="font-family:'IBM Plex Mono'; font-size:16px; color:var(--ink);">2.23&nbsp; 4.10&nbsp; 3.42&nbsp; 2.78&nbsp; 3.85<br>3.27&nbsp; 3.83&nbsp; 3.05&nbsp; 2.60&nbsp; 3.19<br>2.40&nbsp; 3.10&nbsp; 2.96&nbsp; 3.31&nbsp; 4.01</p>

        <h3 style="margin-bottom:10px;">Counts</h3>

        <p style="font-size:18px;">TB: 71 &middot; Malignancy: 54 &middot; Meningitis: 39<br>Non-communicable disease: 60 &middot; Unknown: 76</p>
        <p style="margin-top:10px; font-weight:600; color:var(--red);">Nothing "in between" TB and malignancy.</p>
      </div>
    </div>
  </div>`,

  // 6. TYPES OF DATA
  `<div class="slide">
    <div class="slide-eyebrow">Section 02 &middot; Building Blocks</div>
    <h2>Types of Data</h2>
    <div class="big-cols cols-4">
      <div class="bcard light" style="border-top:5px solid var(--red);">
        <h3>Nominal</h3>
        <p style="font-size:15.5px; color:var(--slate); margin-bottom:8px;">Categorical &middot; no order</p>
        <p>Sex, HIV status, cause of death.</p>
      </div>
      <div class="bcard light" style="border-top:5px solid #F2A93B;">
        <h3>Ordinal</h3>
        <p style="font-size:15.5px; color:var(--slate); margin-bottom:8px;">Categorical &middot; ordered</p>
        <p>WHO clinical stage (I&ndash;IV), education level.</p>
      </div>
      <div class="bcard light" style="border-top:5px solid var(--teal);">

        <h3>Continuous</h3>
        <p style="font-size:15.5px; color:var(--slate); margin-bottom:8px;">Numerical &middot; measured</p>

  </div>`,

  let current = 0;
  const deck = document.getElementById('deck');
  const counter = document.getElementById('counter');
  const progressBar = document.getElementById('progressBar');
  const menuList = document.getElementById('menuList');

  function render(){
    deck.innerHTML = slides.join('');
    const els = deck.querySelectorAll('.slide');
    els.forEach((el,i)=>{ if(i!==current) el.classList.remove('active'); });
    if(els[current]) els[current].classList.add('active');
  }

  function buildMenu(){
    slideTitles.forEach((t,i)=>{
      const item = document.createElement('div');
      item.className = 'menu-item';
      item.innerHTML = `<span class="n">${String(i+1).padStart(2,'0')}</span> ${t}`;
      item.onclick = ()=>{ goTo(i); toggleMenu(); };
      menuList.appendChild(item);
    });
  }

  function updateChrome(){
    counter.textContent = (current+1) + ' / ' + slides.length;
    progressBar.style.width = ((current+1)/slides.length*100) + '%';
    document.getElementById('prevBtn').disabled = current===0;
    document.getElementById('nextBtn').disabled = current===slides.length-1;
  }

  function goTo(i){
    if(i<0 || i>=slides.length) return;
    current = i;
    render();
    updateChrome();
  }

  function toggleMenu(){
    document.getElementById('menuPanel').classList.toggle('open');
    document.getElementById('menuOverlay').classList.toggle('open');
  }

  document.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); goTo(current+1); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); goTo(current-1); }
    else if(e.key==='Home'){ goTo(0); }
    else if(e.key==='End'){ goTo(slides.length-1); }
    else if(e.key==='Escape'){ document.getElementById('menuPanel').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('open'); }
  });

  // basic swipe support
  let touchStartX = null;
  deck.addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].clientX; });
  deck.addEventListener('touchend', (e)=>{
    if(touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(dx < -40) goTo(current+1);
    if(dx > 40) goTo(current-1);
    touchStartX = null;
  });

  buildMenu();
  render();
  updateChrome();
</script>
